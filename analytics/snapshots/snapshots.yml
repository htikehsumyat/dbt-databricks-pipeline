snapshots:
  - name: job_postings_snapshot
    description: "A snapshot recording daily changes to our job postings"
    relation: ref('stg_job_postings_current')
    config:
      schema: snapshots
      unique_key: job_id
      strategy: check
      check_cols:
        - job_title
        - company_name
        - job_location
        - job_schedule_type
        - job_work_from_home
        - salary_min
        - salary_max
        - salary_period
        - salary_currency
        - has_health_insurance
        - has_dental_insurance
        - has_paid_time_off
        - has_no_degree_mentioned
      updated_at: searched_at